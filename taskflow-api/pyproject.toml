# TaskFlow API Implementation Plan

> **For agentic workers:** REQUIRED SUB-SKILL: Use superpowers:subagent-driven-development (recommended) or superpowers:executing-plans to implement this plan task-by-task. Steps use checkbox (`- [ ]`) syntax for tracking.

**Goal:** Build an asynchronous REST API for task management with JWT authentication, user isolation, filtering, pagination, and comprehensive tests.

**Architecture:** FastAPI with layered architecture (routes → schemas → models → database), async/await throughout, JWT auth with access+refresh tokens, SQLite database.

**Tech Stack:** Python 3.12+, FastAPI, Pydantic v2, SQLAlchemy 2.0 (async), aiosqlite, PyJWT, argon2-cffi, pytest, httpx, Ruff.

## Global Constraints

- Python version: 3.12+
- FastAPI with async endpoints
- Pydantic v2 for validation
- SQLAlchemy 2.0 with asyncio
- JWT: HS256, access token 15 min expiry, refresh token 7 days expiry
- Password hashing: argon2-cffi (time_cost=3, memory_cost=65536, parallelism=2)
- SQLite database
- Ruff for linting and formatting
- pytest for testing
- All file paths must be exact as specified
- No TODOs or placeholders in final code

